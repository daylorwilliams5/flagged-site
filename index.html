<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLAGGED</title>
<meta name="description" content="FLAGGED is a fully offline daily flag game for iPhone. Privacy policy and support.">
<style>
  :root {
    --bg: #061724;
    --surface: #102536;
    --border: #294253;
    --ink: #F7FAFC;
    --muted: #91A2B1;
    --accent: #1683FF;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 64px 20px 72px; }
  .brand {
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--accent);
    margin: 0 0 6px;
  }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 12px; font-weight: 800; }
  .tagline { color: var(--muted); margin: 0 0 40px; }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  a.card:hover { border-color: var(--accent); }
  a.card .title { font-weight: 700; font-size: 19px; }
  a.card .desc { color: var(--muted); font-size: 15px; margin-top: 4px; }
  footer {
    margin-top: 44px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">Flagged</p>
  <h1>Ten flags. Once a day.</h1>
  <p class="tagline">A fully offline daily geography game for iPhone. No account, no ads, no tracking.</p>

  <a class="card" href="support.html">
    <div class="title">Support</div>
    <div class="desc">How to play, frequently asked questions, and how to get in touch.</div>
  </a>

  <a class="card" href="privacy-policy.html">
    <div class="title">Privacy Policy</div>
    <div class="desc">What FLAGGED stores on your device, and why it collects nothing.</div>
  </a>

  <footer>
    Questions? <a href="mailto:support@daylor.ai">support@daylor.ai</a>
  </footer>
</div>
</body>
</html>
